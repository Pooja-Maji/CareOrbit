name: SthreeCare CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy pytest httpx jsonschema

      - name: Check architecture privacy boundary
        run: python server/scripts/check_no_health_imports.py

      - name: Run Python unit tests and reference oracle
        run: pytest server/tests

      - name: Export OpenAPI specification
        run: python server/scripts/export_openapi.py
